<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <g transform="translate(250 250)">
    <!-- Torso -->
    <polygon fill="#2463B4" points="-50,-50 50,-50 -50,50"/>
    <polygon fill="#2463B4" points="-50,50 50,-50 50,50"/>

    <!-- Head -->
    <g transform="translate(0 -100)">
      <g transform="rotate(30)">
        <g transform="scale(.5 .5)">
          <polygon fill="#E5AD32" points="-50,-50 50,-50 -50,50"/>
          <polygon fill="#E5AD32" points="-50,50 50,-50 50,50"/>
        </g>
      </g>
    </g>

    <!-- Legs -->
    <g transform="translate(-40 90)">
      <g transform="scale(.2 .6)">
        <polygon fill="#34445B" points="-50,-50 50,-50 -50,50"/>
        <polygon fill="#34445B" points="-50,50 50,-50 50,50"/>
      </g>
      <g transform="translate(0 70)">
        <g transform="scale(.2 .6)">
          <polygon fill="#34445B" points="-50,-50 50,-50 -50,50"/>
          <polygon fill="#34445B" points="-50,50 50,-50 50,50"/>
        </g>
      </g>
    </g>
    <g transform="translate(40 90)">
      <g transform="scale(.2 .6)">
        <polygon fill="#34445B" points="-50,-50 50,-50 -50,50"/>
        <polygon fill="#34445B" points="-50,50 50,-50 50,50"/>
      </g>
      <g transform="translate(0 70)">
        <g transform="scale(.2 .6)">
          <polygon fill="#34445B" points="-50,-50 50,-50 -50,50"/>
          <polygon fill="#34445B" points="-50,50 50,-50 50,50"/>
        </g>
      </g>
    </g>

    <!-- Relaxed arm, pivoted at the shoulder -->
    <g transform="translate(-60 -40)">
      <g transform="rotate(-25)">
        <g transform="translate(-30 0)">
          <g transform="scale(.6 .2)">
            <polygon fill="#2463B4" points="-50,-50 50,-50 -50,50"/>
            <polygon fill="#2463B4" points="-50,50 50,-50 50,50"/>
          </g>
        </g>
        <g transform="translate(-100 0)">
          <g transform="scale(.6 .2)">
            <polygon fill="#E5AD32" points="-50,-50 50,-50 -50,50"/>
            <polygon fill="#E5AD32" points="-50,50 50,-50 50,50"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Waving arm: the elbow inherits the shoulder's transform -->
    <g transform="translate(60 -40)">
      <g transform="rotate(-35)">
        <g transform="translate(30 0)">
          <g transform="scale(.6 .2)">
            <polygon fill="#2463B4" points="-50,-50 50,-50 -50,50"/>
            <polygon fill="#2463B4" points="-50,50 50,-50 50,50"/>
          </g>
        </g>
        <g transform="translate(70 0)">
          <g transform="rotate(-70)">
            <g transform="translate(30 0)">
              <g transform="scale(.6 .2)">
                <polygon fill="#E5AD32" points="-50,-50 50,-50 -50,50"/>
                <polygon fill="#E5AD32" points="-50,50 50,-50 50,50"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
